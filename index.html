<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment Process Flow</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen p-4 sm:p-8 bg-gray-50 flex justify-center items-start pt-16">

    <div class="max-w-6xl w-full">
        <!-- Main Content Container with Gradient Background -->
        <div class="process-bg rounded-3xl p-6 sm:p-12 lg:p-16 flex flex-col gap-12 lg:gap-8">
            
            <!-- Main Header (Inside the container) -->
            <header class="text-center relative z-10 -mt-4 mb-8">
                <h1 class="text-4xl sm:text-5xl font-extrabold text-gray-800">
                    Paying Builders With <span class="text-blue-600">Secure</span>
                </h1>
                <h2 class="text-3xl sm:text-4xl font-semibold italic text-gray-700 mt-1">
                    Payment Software
                </h2>
            </header>

            <!-- Large background circle for aesthetic purposes (Z-index 1) -->
            <div class="background-circle"></div>

            <!-- Content Wrapper (Z-index 10) -->
            <div class="main-content-wrapper w-full flex flex-col lg:flex-row gap-12 lg:gap-24">
                <!-- Left Section: Title and Flow Chart -->
                <div class="w-full lg:w-2/5 flex flex-col sm:flex-row lg:flex-col gap-8">
                    
                    <!-- Title Block (What Is LOREM) -->
                    <div class="flex-shrink-0 w-full sm:w-1/3 lg:w-full flex items-center justify-center lg:justify-start">
                        <div class="text-center lg:text-left p-6 sm:p-0">
                            <h3 class="text-3xl font-bold text-gray-800">
                                What Is
                            </h3>
                            <h4 class="text-4xl font-extrabold text-blue-600 mt-1">
                                LOREM
                            </h4>
                        </div>
                    </div>

                    <!-- Process Steps (Flow Chart) -->
                    <div class="flow-container w-full sm:w-2/3 lg:w-full flex-grow relative pt-4 pb-4">
                        <!-- Custom flow line for visual connection -->
                        <div class="flow-line hidden lg:hidden"></div>

                        <ul id="process-steps" class="flex flex-col space-y-4 w-full">
                            
                            <!-- Step 1: Quote -->
                            <li class="step-item flex items-center" data-step-id="quote">
                                <span class="step-number font-mono text-xl font-bold mr-4 w-10 h-10 flex items-center justify-center rounded-full bg-white shadow-md flex-shrink-0">01</span>
                                <button class="step-button text-base font-semibold py-3 px-6 rounded-full w-full max-w-xs transition duration-300">
                                    <span>Quote</span>
                                </button>
                            </li>

                            <!-- Step 2: Pay Fee -->
                            <li class="step-item flex items-center" data-step-id="pay-fee">
                                <span class="step-number font-mono text-xl font-bold mr-4 w-10 h-10 flex items-center justify-center rounded-full bg-white shadow-md flex-shrink-0">02</span>
                                <button class="step-button text-base font-semibold py-3 px-6 rounded-full w-full max-w-xs transition duration-300">
                                    <span>Pay Fee</span>
                                </button>
                            </li>

                            <!-- Step 3: Complete Work -->
                            <li class="step-item flex items-center" data-step-id="complete-work">
                                <span class="step-number font-mono text-xl font-bold mr-4 w-10 h-10 flex items-center justify-center rounded-full bg-white shadow-md flex-shrink-0">03</span>
                                <button class="step-button text-base font-semibold py-3 px-6 rounded-full w-full max-w-xs transition duration-300">
                                    <span>Complete Work</span>
                                </button>
                            </li>

                            <!-- Step 4: Rate -->
                            <li class="step-item flex items-center" data-step-id="rate">
                                <span class="step-number font-mono text-xl font-bold mr-4 w-10 h-10 flex items-center justify-center rounded-full bg-white shadow-md flex-shrink-0">04</span>
                                <button class="step-button text-base font-semibold py-3 px-6 rounded-full w-full max-w-xs transition duration-300">
                                    <span>Rate</span>
                                </button>
                            </li>

                            <!-- Step 5: Release Funds -->
                            <li class="step-item flex items-center" data-step-id="release-funds">
                                <span class="step-number font-mono text-xl font-bold mr-4 w-10 h-10 flex items-center justify-center rounded-full bg-white shadow-md flex-shrink-0">05</span>
                                <button class="step-button text-base font-semibold py-3 px-6 rounded-full w-full max-w-xs transition duration-300">
                                    <span>Release Funds</span>
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Right Section: Dynamic Content Panel -->
                <div class="w-full lg:w-3/5 p-6 sm:p-10 flex-shrink-0">
                    <h3 id="content-title" class="text-3xl sm:text-4xl font-extrabold text-gray-800 mb-6">
                    </h3>
                    <ul id="content-details" class="text-lg text-gray-600 space-y-4">
                        <!-- Content Details (bullet points) will be injected here -->
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <!-- Link to the external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
